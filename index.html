<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de Video con IA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 60px;
    }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 6px; }
    .sub { color: #777; font-size: 0.92rem; margin-bottom: 36px; }

    .card {
      background: #161616;
      border: 1px solid #252525;
      border-radius: 18px;
      padding: 32px;
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed #333;
      border-radius: 14px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #7c6af0; background: #1a1730; }
    .drop-zone input[type=file] { display: none; }
    .drop-zone .dz-icon { font-size: 2.4rem; margin-bottom: 10px; }
    .drop-zone .dz-label { color: #888; font-size: 0.9rem; }
    .drop-zone .dz-name { color: #7c6af0; font-weight: 600; margin-top: 8px; font-size: 0.9rem; word-break: break-all; }

    /* Section title */
    .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: #666; margin-bottom: 12px; }

    /* Toggle options */
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: #1c1c1c;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .option:hover { border-color: #444; background: #202020; }
    .option.active { border-color: #7c6af0; background: #1a1730; }
    .option input[type=checkbox] { display: none; }
    .option .toggle {
      width: 22px; height: 22px; min-width: 22px;
      border: 2px solid #444;
      border-radius: 6px;
      margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      transition: background .2s, border-color .2s;
    }
    .option.active .toggle { background: #7c6af0; border-color: #7c6af0; }
    .option .opt-text .opt-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
    .option .opt-text .opt-desc { color: #777; font-size: 0.82rem; }

    /* Music upload */
    .music-upload {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .music-upload.visible { display: flex; }
    .music-btn {
      background: #222;
      border: 1px dashed #444;
      border-radius: 10px;
      padding: 12px 16px;
      color: #aaa;
      font-size: 0.88rem;
      cursor: pointer;
      text-align: center;
      transition: border-color .2s;
    }
    .music-btn:hover { border-color: #7c6af0; color: #ccc; }
    .music-btn input { display: none; }

    /* Process button */
    .btn {
      background: #7c6af0;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, opacity .2s;
      letter-spacing: 0.02em;
    }
    .btn:hover { background: #6a58e0; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Progress */
    .progress-wrap { display: none; flex-direction: column; gap: 10px; }
    .progress-bar-bg { background: #222; border-radius: 99px; height: 8px; overflow: hidden; }
    .progress-bar { height: 100%; background: #7c6af0; border-radius: 99px; width: 0%; transition: width .4s; }
    .progress-label { font-size: 0.85rem; color: #aaa; text-align: center; }

    /* Logs */
    .logs { display: none; background: #111; border: 1px solid #222; border-radius: 10px; padding: 12px 14px; font-size: 0.8rem; color: #aaa; line-height: 1.7; }
    .logs span { display: block; }
    .logs span::before { content: "✓ "; color: #22c55e; }
    .logs span.err::before { content: "✗ "; color: #f87171; }

    /* Result */
    .result { display: none; flex-direction: column; gap: 14px; align-items: center; }
    .result video { width: 100%; border-radius: 12px; max-height: 320px; background: #000; }
    .download-btn {
      background: #22c55e; color: white;
      padding: 13px 32px; border-radius: 12px;
      text-decoration: none; font-weight: 700; font-size: 1rem;
      transition: background .2s;
    }
    .download-btn:hover { background: #16a34a; }

    /* Error */
    .error-box { display: none; background: #1e0a0a; border: 1px solid #7f1d1d; border-radius: 10px; padding: 14px; font-size: 0.82rem; color: #f87171; white-space: pre-wrap; word-break: break-all; }

    .spinner { display: inline-block; width: 16px; height: 16px; border: 2.5px solid #555; border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>🎬 Editor de Video con IA</h1>
  <p class="sub">Sube tu video, elige las ediciones y descarga el resultado.</p>

  <div class="card">

    <!-- Video upload -->
    <div>
      <div class="section-title">Video a editar</div>
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('videoInput').click()">
        <div class="dz-icon">📹</div>
        <div class="dz-label">Arrastra tu video aquí o haz clic para seleccionar</div>
        <div class="dz-name" id="videoName"></div>
        <input type="file" id="videoInput" accept="video/*" onchange="onVideoSelected(this)" />
      </div>
    </div>

    <!-- Options -->
    <div>
      <div class="section-title">¿Qué quieres hacer?</div>
      <div class="options">

        <label class="option" id="opt-silencio" onclick="toggleOption('silencio')">
          <input type="checkbox" id="chk-silencio" />
          <div class="toggle" id="toggle-silencio"></div>
          <div class="opt-text">
            <div class="opt-title">🔇 Eliminar silencios</div>
            <div class="opt-desc">Detecta y corta automáticamente las pausas y espacios vacíos del video.</div>
          </div>
        </label>

        <label class="option" id="opt-ruido" onclick="toggleOption('ruido')">
          <input type="checkbox" id="chk-ruido" />
          <div class="toggle" id="toggle-ruido"></div>
          <div class="opt-text">
            <div class="opt-title">🎙️ Reducir ruido de fondo</div>
            <div class="opt-desc">Filtra ruidos externos como viento, ventilador, calle o estática.</div>
          </div>
        </label>

        <label class="option" id="opt-subtitulos" onclick="toggleOption('subtitulos')">
          <input type="checkbox" id="chk-subtitulos" />
          <div class="toggle" id="toggle-subtitulos"></div>
          <div class="opt-text">
            <div class="opt-title">📝 Generar subtítulos automáticos</div>
            <div class="opt-desc">Transcribe el audio con IA (Whisper) y quema los subtítulos en el video.</div>
          </div>
        </label>

        <label class="option" id="opt-musica" onclick="toggleOption('musica')">
          <input type="checkbox" id="chk-musica" />
          <div class="toggle" id="toggle-musica"></div>
          <div class="opt-text">
            <div class="opt-title">🎵 Agregar música de fondo</div>
            <div class="opt-desc">Mezcla una canción de fondo con el audio original del video.</div>
          </div>
        </label>

        <!-- Music file upload (visible only when musica is active) -->
        <div class="music-upload" id="music-upload">
          <div class="music-btn" onclick="document.getElementById('musicInput').click()">
            🎵 <span id="musicName">Haz clic para seleccionar el archivo de música (MP3, WAV, etc.)</span>
            <input type="file" id="musicInput" accept="audio/*" onchange="onMusicSelected(this)" />
          </div>
        </div>

      </div>
    </div>

    <button class="btn" id="btn" onclick="procesar()">Procesar video</button>

    <!-- Progress -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-label" id="progressLabel">Iniciando...</div>
    </div>

    <!-- Logs -->
    <div class="logs" id="logs"></div>

    <!-- Error -->
    <div class="error-box" id="errorBox"></div>

    <!-- Result -->
    <div class="result" id="result">
      <video id="preview" controls></video>
      <a class="download-btn" id="downloadLink" href="#" download="video_editado.mp4">⬇ Descargar video editado</a>
    </div>

  </div>

  <script>
    const state = { silencio: false, ruido: false, subtitulos: false, musica: false };
    const progressSteps = [
      "Subiendo video...",
      "Reduciendo ruido de fondo...",
      "Eliminando silencios...",
      "Generando subtítulos con IA (puede tardar unos minutos)...",
      "Quemando subtítulos en el video...",
      "Mezclando música de fondo...",
      "Finalizando...",
    ];

    function toggleOption(key) {
      state[key] = !state[key];
      const opt = document.getElementById('opt-' + key);
      const toggle = document.getElementById('toggle-' + key);
      opt.classList.toggle('active', state[key]);
      toggle.textContent = state[key] ? '✓' : '';
      if (key === 'musica') {
        document.getElementById('music-upload').classList.toggle('visible', state[key]);
      }
    }

    function onVideoSelected(input) {
      if (input.files[0]) {
        document.getElementById('videoName').textContent = input.files[0].name;
      }
    }

    function onMusicSelected(input) {
      if (input.files[0]) {
        document.getElementById('musicName').textContent = input.files[0].name;
      }
    }

    // Drag & drop
    const dz = document.getElementById('dropZone');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) {
        document.getElementById('videoInput').files = e.dataTransfer.files;
        document.getElementById('videoName').textContent = e.dataTransfer.files[0].name;
      }
    });

    function setProgress(pct, label) {
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressLabel').textContent = label;
    }

    function showLogs(logs) {
      const el = document.getElementById('logs');
      if (!logs || !logs.length) return;
      el.style.display = 'block';
      el.innerHTML = logs.map(l => {
        const isErr = l.toLowerCase().includes('error');
        return `<span class="${isErr ? 'err' : ''}">${l}</span>`;
      }).join('');
    }

    async function procesar() {
      const videoInput = document.getElementById('videoInput');
      const musicInput = document.getElementById('musicInput');
      const btn = document.getElementById('btn');

      if (!videoInput.files[0]) { alert('Selecciona un video primero.'); return; }
      if (!state.silencio && !state.ruido && !state.subtitulos && !state.musica) {
        alert('Selecciona al menos una opción de edición.'); return;
      }
      if (state.musica && !musicInput.files[0]) {
        alert('Selecciona un archivo de música.'); return;
      }

      // Reset UI
      btn.disabled = true;
      document.getElementById('result').style.display = 'none';
      document.getElementById('errorBox').style.display = 'none';
      document.getElementById('logs').style.display = 'none';
      document.getElementById('progressWrap').style.display = 'flex';
      btn.innerHTML = '<span class="spinner"></span>Procesando...';

      setProgress(5, 'Subiendo video...');

      const form = new FormData();
      form.append('video', videoInput.files[0]);
      if (state.musica && musicInput.files[0]) form.append('music', musicInput.files[0]);
      form.append('eliminar_silencios', state.silencio);
      form.append('reducir_ruido', state.ruido);
      form.append('agregar_subtitulos', state.subtitulos);
      form.append('agregar_musica', state.musica && !!musicInput.files[0]);

      // Fake progress animation while waiting
      let progressPct = 10;
      const ticker = setInterval(() => {
        if (progressPct < 88) {
          progressPct += state.subtitulos ? 0.4 : 1.2;
          const idx = Math.min(Math.floor(progressPct / 20), progressSteps.length - 1);
          setProgress(progressPct, progressSteps[idx]);
        }
      }, 500);

      try {
        const res = await fetch('/procesar', { method: 'POST', body: form });
        const data = await res.json();
        clearInterval(ticker);

        if (data.error) {
          setProgress(0, '');
          document.getElementById('progressWrap').style.display = 'none';
          document.getElementById('errorBox').style.display = 'block';
          document.getElementById('errorBox').textContent = 'Error: ' + data.error;
          showLogs(data.logs);
        } else {
          setProgress(100, '¡Listo!');
          setTimeout(() => {
            document.getElementById('progressWrap').style.display = 'none';
            document.getElementById('result').style.display = 'flex';
            document.getElementById('preview').src = data.url;
            document.getElementById('downloadLink').href = data.url;
            showLogs(data.logs);
          }, 600);
        }
      } catch (e) {
        clearInterval(ticker);
        document.getElementById('progressWrap').style.display = 'none';
        document.getElementById('errorBox').style.display = 'block';
        document.getElementById('errorBox').textContent = 'Error de conexión: ' + e.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Procesar video';
      }
    }
  </script>
</body>
</html>
